<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #07080a;
      color: #eef0f2;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    #root {
      width: 100%;
      min-height: 100vh;
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-size: 18px;
      color: #8b9099;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading">Loading portfolio...</div>
  </div>

  <!-- Load React from CDN -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- Load the dc-runtime support -->
  <script src="./support.js"></script>

  <!-- Inline the Portfolio component -->
  <script>
    // Simple loader for the Portfolio.dc.html
    fetch('./Portfolio.dc.html')
      .then(res => res.text())
      .then(html => {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const dcContent = doc.querySelector('x-dc');
        const helmet = dcContent?.querySelector('helmet');

        if (dcContent) {
          // Copy head elements
          if (helmet) {
            const headElements = helmet.querySelectorAll('*');
            headElements.forEach(el => {
              document.head.appendChild(el.cloneNode(true));
            });
          }

          // Copy body content
          const root = document.getElementById('root');
          root.innerHTML = '';

          // Copy main content
          const mainContent = dcContent.querySelector('main') || dcContent;
          if (mainContent) {
            root.appendChild(mainContent.cloneNode(true));
          }

          // Copy footer
          const footer = dcContent.querySelector('footer');
          if (footer) {
            root.appendChild(footer.cloneNode(true));
          }
        }
      })
      .catch(err => {
        console.error('Failed to load portfolio:', err);
        document.getElementById('root').innerHTML = '<div class="loading">Error loading portfolio. Please refresh the page.</div>';
      });
  </script>
</body>
</html>
